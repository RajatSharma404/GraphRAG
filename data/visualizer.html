<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>GraphRAG 3D Knowledge Graph Visualizer</title>
  <script src="https://unpkg.com/3d-force-graph"></script>
  <style>
    body { margin: 0; background: #0a0b10; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
    #info-panel {
      position: absolute; top: 20px; left: 20px; z-index: 10;
      background: rgba(18, 22, 34, 0.85); backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 12px;
      padding: 16px 20px; color: #fff; max-width: 380px; box-shadow: 0 8px 32px rgba(0,0,0,0.5);
    }
    h2 { margin: 0 0 8px; font-size: 1.1rem; color: #38bdf8; }
    p { margin: 4px 0; font-size: 0.85rem; color: #94a3b8; line-height: 1.4; }
    .badge { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 0.7rem; font-weight: 600; text-transform: uppercase; background: #0369a1; color: #e0f2fe; margin-top: 6px; }
  </style>
</head>
<body>
  <div id="info-panel">
    <h2>Hybrid GraphRAG Visualizer</h2>
    <p>Click on any node to inspect entity properties, community cluster, and connections.</p>
    <div id="node-details" style="display: none; margin-top: 12px; border-top: 1px solid rgba(255,255,255,0.1); padding-top: 8px;">
      <h3 id="node-title" style="margin: 0; color: #f8fafc; font-size: 1rem;"></h3>
      <span id="node-type" class="badge"></span>
      <p id="node-desc" style="margin-top: 8px;"></p>
    </div>
  </div>
  <div id="3d-graph"></div>

  <script>
    fetch('processed/graph.json')
      .then(res => res.json())
      .catch(() => ({
        nodes: [
          { id: "ASML", group: 1, type: "ORGANIZATION", desc: "Monopoly on EUV lithography systems" },
          { id: "TSMC", group: 1, type: "ORGANIZATION", desc: "Advanced wafer fabrication facilities" },
          { id: "SK Hynix", group: 1, type: "ORGANIZATION", desc: "Supplies HBM3e and HBM4 stacked memory" },
          { id: "Nvidia", group: 2, type: "ORGANIZATION", desc: "Tensor Core GPU & NVLink designer" },
          { id: "Microsoft Azure", group: 2, type: "ORGANIZATION", desc: "Hyperscale AI cloud infrastructure" },
          { id: "OpenAI", group: 2, type: "ORGANIZATION", desc: "AI frontier research and model training" },
          { id: "Google Cloud", group: 3, type: "ORGANIZATION", desc: "Enterprise cloud hosting and TPU developer" }
        ],
        links: [
          { source: "ASML", target: "TSMC", label: "SUPPLIES_SCANNERS" },
          { source: "TSMC", target: "Nvidia", label: "FABRICATES_CHIPS" },
          { source: "SK Hynix", target: "Nvidia", label: "SUPPLIES_HBM" },
          { source: "Nvidia", target: "Microsoft Azure", label: "DEPLOYS_SYSTEMS" },
          { source: "Microsoft Azure", target: "OpenAI", label: "EXCLUSIVE_HOST" },
          { source: "TSMC", target: "Google Cloud", label: "MANUFACTURES_TPUS" }
        ]
      }))
      .then(gData => {
        const Graph = ForceGraph3D()(document.getElementById('3d-graph'))
          .graphData(gData)
          .nodeAutoColorBy('group')
          .nodeLabel(node => `${node.id} (${node.type || 'Entity'})`)
          .linkLabel(link => link.label || 'RELATED_TO')
          .linkDirectionalParticles(2)
          .linkDirectionalParticleSpeed(0.006)
          .onNodeClick(node => {
            document.getElementById('node-details').style.display = 'block';
            document.getElementById('node-title').innerText = node.id;
            document.getElementById('node-type').innerText = (node.type || 'Entity') + ' (Community ' + (node.group || 0) + ')';
            document.getElementById('node-desc').innerText = node.desc || 'No description recorded.';
            Graph.cameraPosition({ x: node.x * 1.5, y: node.y * 1.5, z: node.z * 1.5 + 40 }, node, 1000);
          });
      });
  </script>
</body>
</html>
